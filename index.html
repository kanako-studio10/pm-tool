<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM管理シート</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--cream:#FFFDF5;--yellow:#FFE566;--yellow-light:#FFF8CC;--coral:#FF6B6B;--mint:#4ECDC4;--sky:#74B9FF;--lavender:#A29BFE;--ink:#2D3436;--ink-light:#636E72;--border:#E8E0C8;--white:#FFFFFF;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic Pro","Yu Gothic UI",sans-serif;background:var(--cream);color:var(--ink);font-size:15px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.header{background:var(--yellow);padding:14px 24px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--ink);position:relative;}
.header::after{content:"🍵 🍡 🍓";position:absolute;right:24px;font-size:16px;letter-spacing:4px;}
.header h1{font-size:22px;font-weight:700;}
.tabs{display:flex;background:var(--white);border-bottom:3px solid var(--ink);padding:0 20px;overflow-x:auto;}
.tab{padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink-light);border-bottom:4px solid transparent;margin-bottom:-3px;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.tab.active{color:var(--ink);border-bottom:4px solid var(--coral);}
.tab:hover:not(.active){color:var(--ink);background:var(--yellow-light);}
.panel{display:none;padding:20px 24px;}
.panel.active{display:block;}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{padding:8px 16px;font-size:14px;font-weight:700;border-radius:20px;border:2px solid var(--ink);background:var(--white);cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px;box-shadow:2px 2px 0 var(--ink);transition:all 0.1s;}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink);}
.btn-yellow{background:var(--yellow);}
.btn-coral{background:var(--coral);color:var(--white);border-color:var(--coral);}
.btn-mint{background:var(--mint);color:var(--white);border-color:var(--mint);}
.btn-sky{background:var(--sky);color:var(--white);border-color:var(--sky);}
select.filter{font-size:14px;padding:7px 12px;border:2px solid var(--ink);border-radius:20px;background:var(--white);color:var(--ink);cursor:pointer;font-weight:600;box-shadow:2px 2px 0 var(--ink);}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;display:inline-block;border:1.5px solid transparent;}
.table-wrap{background:var(--white);border-radius:16px;border:2px solid var(--ink);overflow:hidden;box-shadow:4px 4px 0 var(--ink);}
.resizable-table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed;}
.resizable-table th{background:var(--yellow-light);padding:11px 14px;text-align:left;font-size:13px;font-weight:700;color:var(--ink);border-bottom:2px solid var(--ink);user-select:none;white-space:nowrap;position:relative;overflow:hidden;}
.resizable-table th.sortable{cursor:pointer;}
.resizable-table th.sortable:hover{background:var(--yellow);}
.col-resize{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;background:transparent;z-index:1;}
.col-resize:hover,.col-resize.dragging{background:var(--sky);}
.resizable-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:middle;overflow:hidden;}
.resizable-table td .cell-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.resizable-table tr:last-child td{border-bottom:none;}
.resizable-table tr:hover td{background:var(--yellow-light);}
td.editable{cursor:pointer;}
td.editable:hover{background:#FFF0CC !important;}
td.editing{padding:4px 8px;}
.cell-input,.cell-select{font-size:14px;padding:5px 10px;border:2px solid var(--sky);border-radius:10px;background:var(--white);color:var(--ink);width:100%;outline:none;font-weight:500;}
.del-btn{padding:4px 8px;font-size:13px;border-radius:10px;border:2px solid var(--border);background:transparent;cursor:pointer;color:var(--coral);font-weight:700;}
.del-btn:hover{background:#FFEEEE;border-color:var(--coral);}
.empty-state{text-align:center;color:var(--ink-light);padding:48px 20px;font-size:14px;}
.hint{font-size:12px;color:var(--ink-light);margin-bottom:8px;}
.gantt-wrap{background:var(--white);border-radius:16px;border:2px solid var(--ink);overflow:hidden;box-shadow:4px 4px 0 var(--ink);}
.gantt-scroll{overflow-x:auto;position:relative;}
.gantt-inner{position:relative;}
.pj-label-overlay{position:absolute;left:0;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;padding:0 8px;pointer-events:none;background:rgba(255,253,245,0.98);border-right:2px solid var(--ink);z-index:6;white-space:nowrap;}
canvas{display:block;position:relative;z-index:1;}
.ms-marker{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;}
.ms-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;background:#fff;box-shadow:1px 1px 0 var(--ink);transition:transform 0.1s;}
.ms-marker:hover .ms-dot{transform:scale(1.2);z-index:10;}
.ms-label{font-size:10px;font-weight:600;white-space:nowrap;background:rgba(255,253,245,0.9);padding:0 3px;border-radius:4px;max-width:80px;overflow:hidden;text-overflow:ellipsis;}
.ms-marker:hover .ms-label{z-index:10;max-width:none;background:var(--ink);color:#fff;padding:2px 6px;}
.task-marker{position:absolute;transform:translateY(-50%);z-index:4;cursor:pointer;display:flex;align-items:center;gap:5px;}
.task-bar{height:16px;border:1.5px solid var(--ink);border-radius:6px;box-shadow:1px 1px 0 rgba(45,52,54,0.3);}
.task-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);box-shadow:1px 1px 0 rgba(45,52,54,0.3);}
.task-label{font-size:11px;font-weight:500;white-space:nowrap;color:var(--ink);}
.task-marker:hover .task-label{font-weight:700;}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;align-items:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);}
.pj-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.pj-tag{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;border:2px solid var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:all 0.1s;}
.pj-tag:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
.section-label{font-size:13px;font-weight:700;color:var(--ink-light);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.section-label::before{content:"";display:none;}
.overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(45,52,54,0.5);z-index:1000;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--cream);border-radius:20px;padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);}
.modal-title{font-size:18px;font-weight:700;margin-bottom:22px;}
.form-row{margin-bottom:14px;}
.form-row label{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:5px;display:block;}
.form-row input,.form-row select{width:100%;font-size:14px;padding:9px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--white);color:var(--ink);font-weight:500;}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(116,185,255,0.25);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.color-grid{display:grid;grid-template-columns:repeat(5,40px);gap:8px;margin-bottom:16px;}
.color-dot{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;box-shadow:2px 2px 0 var(--ink);}
.color-dot.selected{border:3px solid var(--ink);}

/* ▼▼ 追加：PJ並べ替え・アーカイブ用 ▼▼ */
.pj-ctrls{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle;}
.pj-ctrl{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:11px;border:1.5px solid currentColor;opacity:0.65;}
.pj-ctrl:hover{opacity:1;background:rgba(255,255,255,0.45);}
.pj-tag.archived{opacity:0.5;}
/* ▲▲ 追加ここまで ▲▲ */

/* ガントチャート 2カラム化（PJ列固定） */


/* スマホ対応：768px以下 */
@media (max-width:768px){
  /* フォームの2カラムグリッドを1カラムに */
  .form-grid{grid-template-columns:1fr;}
  .form-row input,.form-row select{max-width:100%;width:100%;}
  .header{padding:12px 16px;flex-wrap:wrap;}
  .header::after{display:none;}
  .header h1{font-size:18px;}
  #save-status{margin-right:0;font-size:11px;width:100%;text-align:left;margin-left:32px;}
  .tabs{padding:0 8px;gap:0;}
  .tab{padding:10px 12px;font-size:13px;}
  .panel{padding:14px 12px;}
  .toolbar{gap:6px;}
  .btn{padding:6px 12px;font-size:13px;}
  select.filter{padding:6px 10px;font-size:13px;}
  /* テーブル → カード表示 */
  .resizable-table thead{display:none;}
  .resizable-table,.resizable-table tbody,.resizable-table tr,.resizable-table td{display:block;width:100%;}
  .resizable-table tr{background:#fff;border-radius:12px;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);margin-bottom:10px;padding:10px;}
  .resizable-table tr:last-child td{border-bottom:1px solid var(--border);}
  .resizable-table td{padding:6px 4px;border-bottom:1px dashed var(--border);overflow:visible;text-align:right;position:relative;padding-left:90px;min-height:32px;}
  .resizable-table td:last-child{border-bottom:none;}
  .resizable-table td::before{content:attr(data-label);position:absolute;left:4px;top:6px;font-size:11px;font-weight:700;color:var(--ink-light);text-align:left;}
  .resizable-table td .cell-text{white-space:normal;text-align:right;}
  .resizable-table tr:hover td{background:transparent;}
  /* リサイズハンドル無効 */
  .col-resize{display:none;}
  /* モーダルもスマホ対応 */
  .modal{padding:20px 16px;}
  .modal-title{font-size:16px;margin-bottom:16px;}
  /* PJタグ */
  .pj-tag{font-size:12px;padding:5px 10px;}
  /* ガントチャート：スマホでも横スクロール */
  .gantt-scroll{}
}

</style>
</head>
<body>

<div class="header">
  <span style="font-size:28px;">📋</span>
  <h1>PM管理シート</h1>
  <span id="save-status" style="font-size:12px;color:var(--ink-light);margin-left:auto;margin-right:40px;"></span>
</div>

<div class="tabs">
  <div class="tab active" onclick="sw('gantt')">🍜 ガントチャート</div>
  <div class="tab" onclick="sw('tasks')">🍙 タスク一覧</div>
  <div class="tab" onclick="sw('waiting')">🍵 誰か待ち</div>
  <div class="tab" onclick="sw('stake')">🍡 ステークホルダー</div>
</div>

<div id="gantt" class="panel active">
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn btn-coral" onclick="goToday()">📍 今日</button>
      <button class="btn" id="archive-toggle" onclick="toggleArchiveView()">📦 アーカイブ表示</button>
    </div>
    <div class="toolbar-left">
      <button class="btn btn-yellow" onclick="openModal('milestone')">🍰 マイルストーン</button>
      <button class="btn btn-mint" onclick="openModal('task')">🍙 タスク</button>
      <button class="btn btn-sky" onclick="openModal('waiting')">🍵 誰か待ち</button>
      <button class="btn btn-coral" onclick="openModal('pj')">🍓 PJ追加</button>
    </div>
  </div>
  <div class="gantt-wrap"><div class="gantt-scroll" id="gantt-scroll"><div class="gantt-inner" id="gantt-inner"><canvas id="gc"></canvas></div></div></div>
  <div class="legend" id="legend"></div>
  <div style="margin-top:16px;">
    <div class="section-label">PJ管理（名前クリックで編集／▲▼で並べ替え／📦でアーカイブ）</div>
    <div class="pj-tags" id="pj-list"></div>
  </div>
</div>

<div id="tasks" class="panel">
  <div class="toolbar">
    <div class="toolbar-left">
      <select class="filter" id="fpj" onchange="renderTasks()"><option value="">全PJ</option></select>
      <select class="filter" id="fst" onchange="renderTasks()"><option value="">全ステータス</option><option>未着手</option><option>進行中</option><option>誰か待ち</option><option>完了</option></select>
    </div>
    <button class="btn btn-mint" onclick="openModal('task')">🍙 タスク追加</button>
  </div>
  
  <div class="table-wrap">
    <table class="resizable-table" id="task-table">
      <colgroup><col id="tc-pj" style="width:90px"><col id="tc-task" style="width:240px"><col id="tc-assign" style="width:110px"><col id="tc-start" style="width:105px"><col id="tc-deadline" style="width:105px"><col id="tc-status" style="width:105px"><col style="width:40px"></colgroup>
      <thead><tr>
        <th class="sortable" onclick="sortT('pj')">PJ ⇅<span class="col-resize" onmousedown="startResize(event,'tc-pj')"></span></th>
        <th class="sortable" onclick="sortT('task')">タスク内容 ⇅<span class="col-resize" onmousedown="startResize(event,'tc-task')"></span></th>
        <th class="sortable" onclick="sortT('assign')">担当 ⇅<span class="col-resize" onmousedown="startResize(event,'tc-assign')"></span></th>
        <th class="sortable" onclick="sortT('start')">開始日 ⇅<span class="col-resize" onmousedown="startResize(event,'tc-start')"></span></th>
        <th class="sortable" onclick="sortT('deadline')">期限 ⇅<span class="col-resize" onmousedown="startResize(event,'tc-deadline')"></span></th>
        <th class="sortable" onclick="sortT('status')">状態 ⇅<span class="col-resize" onmousedown="startResize(event,'tc-status')"></span></th>
        <th></th>
      </tr></thead>
      <tbody id="task-body"></tbody>
    </table>
  </div>
</div>

<div id="waiting" class="panel">
  <div class="toolbar"><span style="font-size:15px;font-weight:700;">🍵 誰か待ちリスト</span><button class="btn btn-sky" onclick="openModal('waiting')">🍵 追加</button></div>
  
  <div class="table-wrap">
    <table class="resizable-table" id="wait-table">
      <colgroup><col id="wc-pj" style="width:90px"><col id="wc-person" style="width:110px"><col id="wc-content" style="width:220px"><col id="wc-req" style="width:105px"><col id="wc-due" style="width:105px"><col id="wc-status" style="width:90px"><col style="width:40px"></colgroup>
      <thead><tr>
        <th>PJ<span class="col-resize" onmousedown="startResize(event,'wc-pj')"></span></th>
        <th>依頼先<span class="col-resize" onmousedown="startResize(event,'wc-person')"></span></th>
        <th>依頼内容<span class="col-resize" onmousedown="startResize(event,'wc-content')"></span></th>
        <th>依頼日<span class="col-resize" onmousedown="startResize(event,'wc-req')"></span></th>
        <th>回答期待日<span class="col-resize" onmousedown="startResize(event,'wc-due')"></span></th>
        <th>状態<span class="col-resize" onmousedown="startResize(event,'wc-status')"></span></th>
        <th></th>
      </tr></thead>
      <tbody id="wait-body"></tbody>
    </table>
  </div>
</div>

<div id="stake" class="panel">
  <div class="toolbar"><span style="font-size:15px;font-weight:700;">🍡 ステークホルダー</span><button class="btn" style="background:var(--lavender);color:#fff;border-color:var(--lavender);" onclick="openModal('stake')">🍡 追加</button></div>
  
  <div class="table-wrap">
    <table class="resizable-table" id="stake-table">
      <colgroup><col id="sc-pj" style="width:90px"><col id="sc-name" style="width:110px"><col id="sc-role" style="width:180px"><col id="sc-contact" style="width:120px"><col id="sc-priority" style="width:70px"><col id="sc-memo" style="width:180px"><col style="width:40px"></colgroup>
      <thead><tr>
        <th>PJ<span class="col-resize" onmousedown="startResize(event,'sc-pj')"></span></th>
        <th>氏名<span class="col-resize" onmousedown="startResize(event,'sc-name')"></span></th>
        <th>役割・所属<span class="col-resize" onmousedown="startResize(event,'sc-role')"></span></th>
        <th>連絡手段<span class="col-resize" onmousedown="startResize(event,'sc-contact')"></span></th>
        <th>優先度<span class="col-resize" onmousedown="startResize(event,'sc-priority')"></span></th>
        <th>備考<span class="col-resize" onmousedown="startResize(event,'sc-memo')"></span></th>
        <th></th>
      </tr></thead>
      <tbody id="stake-body"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-box"></div></div>

<script>
var PJS=[
  {name:"GGP",color:"#74B9FF",light:"#E8F4FF",text:"#0C447C",emoji:"🍵"},

  });

    if(w.dueDate)taskRows.push({type:"wait",pj:w.pj,name:w.person+"："+w.content,date:w.dueDate,widx:idx});
  });
  var rowsPerPJ={};pjNames.forEach(function(n){rowsPerPJ[n]=0;});
  var assignedRows={};

  var totalRows=pjNames.reduce(function(s,n){return s+Math.max(1,rowsPerPJ[n]+1)+1;},0);
  var LABEL_TEXT=210;

  var cssH=HEAD+totalRows*ROW+16;

  inner.style.width=cssW+"px";inner.style.height=cssH+"px";

  ctx.clearRect(0,0,cssW,cssH);
  var start=new Date(viewStart);
  var today=new Date();today.setHours(0,0,0,0);
  var mlabelEl=document.getElementById("mlabel");

  ctx.fillStyle="#FFFDF5";ctx.fillRect(0,0,cssW,cssH);
  ctx.fillStyle="#FFF8CC";ctx.fillRect(0,0,cssW,HEAD);

    if(dt.getDate()===1){ctx.strokeStyle="#2D3436";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cssH);ctx.stroke();ctx.fillStyle="#2D3436";ctx.font="bold 13px sans-serif";ctx.fillText((dt.getMonth()+1)+"月",x+4,24);}
    if(dt.getDate()===8||dt.getDate()===15||dt.getDate()===22){ctx.strokeStyle="rgba(45,52,54,0.08)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,HEAD);ctx.lineTo(x,cssH);ctx.stroke();ctx.fillStyle="#888";ctx.font="11px sans-serif";ctx.fillText(dt.getDate()+"日",x+2,HEAD-10);}
    if(dt.getDate()===1){ctx.fillStyle="#888";ctx.font="11px sans-serif";ctx.fillText("1日",x+2,HEAD-10);}
  }
  var todayD=Math.round((today-start)/864e5);
  if(todayD>=0&&todayD<DAYS){var tx=LABEL+todayD*DAY_W;ctx.strokeStyle="#FF6B6B";ctx.lineWidth=2.5;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(tx,0);ctx.lineTo(tx,cssH);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#FF6B6B";ctx.font="bold 12px sans-serif";ctx.fillText("今日",tx+3,20);}
  ctx.strokeStyle="#2D3436";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(LABEL,0);ctx.lineTo(LABEL,cssH);ctx.stroke();ctx.beginPath();ctx.moveTo(0,HEAD);ctx.lineTo(cssW,HEAD);ctx.stroke();
  var rowOffset=0;
  pjNames.forEach(function(pjName){
    var pj=getPJ(pjName);
    var pjTaskCount=Math.max(1,rowsPerPJ[pjName]+1);
    var y=HEAD+rowOffset*ROW;var h=(pjTaskCount+1)*ROW;
    ctx.fillStyle=pj.light;ctx.fillRect(0,y,cssW,h);
    ctx.fillStyle=pj.color;ctx.fillRect(0,y,6,h);
    // PJ名はHTMLオーバーレイで表示

    pjLabel.style.top=y+"px";
    pjLabel.style.height=ROW+"px";

    inner.appendChild(pjLabel);
    ctx.fillStyle=pj.color+"22";if(ctx.roundRect){ctx.beginPath();ctx.roundRect(LABEL+2,y+ROW/2-8,DAYS*DAY_W-4,16,8);ctx.fill();}else ctx.fillRect(LABEL+2,y+ROW/2-8,DAYS*DAY_W-4,16);
    // マイルストーン → DOM要素で配置（重なってもクリック可能）
    milestones.filter(function(m){return m.pj===pjName;}).forEach(function(m){
      var gi=milestones.indexOf(m);
      var md=new Date(m.date);var diff=Math.round((md-start)/864e5);
      if(diff<-2||diff>DAYS+2)return;
      var mx=LABEL+diff*DAY_W;
      var marker=document.createElement("div");

      var key=tr.pj+"|"+tr.name;var subRow=assignedRows[key];
      var ty=y+(subRow+1)*ROW;
      ctx.strokeStyle="rgba(45,52,54,0.05)";ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.beginPath();ctx.moveTo(LABEL,ty+ROW);ctx.lineTo(LABEL+DAYS*DAY_W,ty+ROW);ctx.stroke();ctx.setLineDash([]);
      var marker=document.createElement("div");

        marker.style.left=bx+"px";
        marker.innerHTML='<span style="font-size:14px;">🍙</span><div class="task-bar" style="width:'+bw+'px;background:'+(tr.status==="完了"?"#00B894":pj.color)+';"></div><div class="task-label">'+tr.name+'</div>';

          marker.innerHTML='<span style="font-size:16px;">🍙</span><div class="task-label">'+tr.name+'</div>';

      }

    });

    rowOffset+=pjTaskCount+1;
  });
  var leg=document.getElementById("legend");leg.innerHTML="";

  renderPJList();

             '<span style="font-size:14px;">'+p.emoji+'</span> '+p.name+

      ? '<span class="pj-ctrl" onclick="togglePJHidden('+i+')" title="表示に戻す">↩</span>'

function renderStake(eI,eF){var pc={高:"#FF6B6B",中:"#FDCB6E",低:"#B2BEC3"};var tc={高:"#fff",中:"#8B6914",低:"#636E72"};var html="";stakeholders.forEach(function(s,i){var isE=(eI===i);html+="<tr>";html+=isE&&eF==="pj"?'<td class="editing"><select class="cell-select" onchange="cstake('+i+',\'pj\',this.value);renderStake()" onblur="renderStake()">'+getPJOptions(s.pj)+'</select></td>':ec(pjBadge(s.pj),"estake("+i+",'pj')","PJ");html+=isE&&eF==="name"?'<td class="editing"><input class="cell-input" value="'+esc(s.name)+'" onblur="cstake('+i+',\'name\',this.value);renderStake()" onkeydown="if(event.key===\'Enter\')this.blur()"></td>':ec('<strong>'+esc(s.name)+'</strong>',"estake("+i+",'name')","氏名");html+=isE&&eF==="role"?'<td class="editing"><input class="cell-input" value="'+esc(s.role)+'" onblur="cstake('+i+',\'role\',this.value);renderStake()" onkeydown="if(event.key===\'Enter\')this.blur()"></td>':ec('<span title="'+esc(s.role)+'">'+esc(s.role)+'</span>',"estake("+i+",'role')","役割");html+=isE&&eF==="contact"?'<td class="editing"><input class="cell-input" value="'+esc(s.contact)+'" onblur="cstake('+i+',\'contact\',this.value);renderStake()" onkeydown="if(event.key===\'Enter\')this.blur()"></td>':ec(esc(s.contact),"estake("+i+",'contact')","連絡");html+=isE&&eF==="priority"?'<td class="editing"><select class="cell-select" onchange="cstake('+i+',\'priority\',this.value);renderStake()"><option'+(s.priority==="高"?" selected":"")+'>高</option><option'+(s.priority==="中"?" selected":"")+'>中</option><option'+(s.priority==="低"?" selected":"")+'>低</option></select></td>':ec('<span class="badge" style="background:'+pc[s.priority]+';color:'+tc[s.priority]+';border-color:'+pc[s.priority]+';">'+s.priority+'</span>',"estake("+i+",'priority')","優先度");html+=isE&&eF==="memo"?'<td class="editing"><input class="cell-input" value="'+esc(s.memo||"")+'" onblur="cstake('+i+',\'memo\',this.value);renderStake()" onkeydown="if(event.key===\'Enter\')this.blur()" placeholder="備考..."></td>':ec((s.memo?'<span title="'+esc(s.memo)+'">'+esc(s.memo)+'</span>':'<span style="color:#ccc">—</span>'),"estake("+i+",'memo')","備考");html+='<td><button class="del-btn" onclick="delStake('+i+')">✕</button></td>';html+="</tr>";});document.getElementById("stake-body").innerHTML=html||'<tr><td colspan="7" class="empty-state">🍡 データがありません</td></tr>';if(eI!==undefined){var inp=document.querySelectorAll("#stake-body .cell-input,.cell-select");if(inp.length)setTimeout(function(){inp[inp.length-1].focus();},30);}}
function estake(i,f){renderStake(i,f);}
function cstake(i,f,v){stakeholders[i][f]=v;syncSave();}
function delStake(i){if(confirm("削除しますか？")){stakeholders.splice(i,1);syncSave();renderStake();}}

function editMS(i){var m=milestones[i];var h='<div class="modal-title">🍰 マイルストーンを編集</div><div class="form-row"><label>PJ</label><select id="m-pj">'+getPJOptions(m.pj)+'</select></div><div class="form-row"><label>マイルストーン名</label><input type="text" id="m-mname" value="'+esc(m.name)+'"></div><div class="form-row"><label>日付</label><input type="date" id="m-mdate" value="'+m.date+'"></div><div class="modal-btns"><button class="btn btn-yellow" style="flex:1" onclick="saveEditMS('+i+')">保存</button><button class="btn" style="flex:1" onclick="closeModal()">キャンセル</button><button class="btn" style="color:#FF6B6B;border-color:#FF6B6B;" onclick="delMS('+i+')">削除</button></div>';openWith(h);}
function saveEditMS(i){milestones[i]={pj:gv("m-pj"),name:gv("m-mname"),date:gv("m-mdate")};syncSave();closeModal();renderGantt();}
function delMS(i){if(!confirm("削除しますか？"))return;milestones.splice(i,1);syncSave();closeModal();renderGantt();}

function openModal(type){var h="";if(type==="task"){h='<div class="modal-title">🍙 タスク追加</div><div class="form-row"><label>PJ</label><select id="m-pj">'+getPJOptions()+'</select></div><div class="form-row"><label>タスク内容</label><input type="text" id="m-task" placeholder="例：会議資料作成"></div><div class="form-row"><label>担当</label><input type="text" id="m-assign" placeholder="例：かなこ、矢島さん待ち"></div><div class="form-grid"><div class="form-row"><label>開始日</label><input type="date" id="m-start"></div><div class="form-row"><label>期限日</label><input type="date" id="m-end"></div></div><div class="form-row"><label>締切の理由</label><input type="text" id="m-reason"></div><div class="form-row"><label>ステータス</label><select id="m-status"><option>未着手</option><option>進行中</option><option>誰か待ち</option><option>完了</option></select></div><div class="modal-btns"><button class="btn btn-mint" style="flex:1" onclick="saveTask()">追加する！</button><button class="btn" style="flex:1" onclick="closeModal()">キャンセル</button></div>';}else if(type==="waiting"){h='<div class="modal-title">🍵 誰か待ち追加</div><div class="form-row"><label>PJ</label><select id="m-pj">'+getPJOptions()+'</select></div><div class="form-row"><label>依頼先</label><input type="text" id="m-person"></div><div class="form-row"><label>依頼内容</label><input type="text" id="m-content"></div><div class="form-grid"><div class="form-row"><label>依頼日</label><input type="date" id="m-req"></div><div class="form-row"><label>回答期待日</label><input type="date" id="m-due"></div></div><div class="form-row"><label>状態</label><select id="m-wst"><option>未依頼</option><option>待ち中</option><option>完了</option></select></div><div class="modal-btns"><button class="btn btn-sky" style="flex:1" onclick="saveWait()">追加する！</button><button class="btn" style="flex:1" onclick="closeModal()">キャンセル</button></div>';}else if(type==="milestone"){h='<div class="modal-title">🍰 マイルストーン追加</div><div class="form-row"><label>PJ</label><select id="m-pj">'+getPJOptions()+'</select></div><div class="form-row"><label>マイルストーン名</label><input type="text" id="m-mname"></div><div class="form-row"><label>日付</label><input type="date" id="m-mdate"></div><div class="modal-btns"><button class="btn btn-yellow" style="flex:1" onclick="saveMS()">追加する！</button><button class="btn" style="flex:1" onclick="closeModal()">キャンセル</button></div>';}else if(type==="stake"){h='<div class="modal-title">🍡 ステークホルダー追加</div><div class="form-row"><label>PJ</label><select id="m-pj">'+getPJOptions()+'</select></div><div class="form-row"><label>氏名</label><input type="text" id="m-sname"></div><div class="form-row"><label>役割・所属</label><input type="text" id="m-srole"></div><div class="form-row"><label>連絡手段</label><input type="text" id="m-scon"></div><div class="form-row"><label>優先度</label><select id="m-spri"><option>高</option><option>中</option><option>低</option></select></div><div class="form-row"><label>備考</label><input type="text" id="m-memo"></div><div class="modal-btns"><button class="btn" style="flex:1;background:#A29BFE;color:#fff;border-color:#A29BFE;" onclick="saveStake()">追加する！</button><button class="btn" style="flex:1" onclick="closeModal()">キャンセル</button></div>';}else if(type==="pj"){h='<div class="modal-title">🍓 PJ追加</div><div class="form-row"><label>PJ名</label><input type="text" id="m-pjname" placeholder="例：MINATO"></div><div class="form-row"><label>アイコン（絵文字）</label><input type="text" id="m-emoji" placeholder="🍩" maxlength="2" value="🍩"></div><p style="font-size:13px;font-weight:600;color:#636E72;margin-bottom:10px;">カラーを選択</p><div class="color-grid" id="color-grid"></div><div class="modal-btns"><button class="btn btn-coral" style="flex:1" onclick="savePJ()">追加する！</button><button class="btn" style="flex:1" onclick="closeModal()">キャンセル</button></div>';openWith(h);buildCG(null);return;}openWith(h);}
function editPJ(i){var p=PJS[i];editingPJIdx=i;pickedColor=p.color;var h='<div class="modal-title">✎ PJを編集</div><div class="form-row"><label>PJ名</label><input type="text" id="ep-name" value="'+esc(p.name)+'"></div><div class="form-row"><label>アイコン（絵文字）</label><input type="text" id="ep-emoji" value="'+(p.emoji||"🍩")+'" maxlength="2"></div><p style="font-size:13px;font-weight:600;color:#636E72;margin-bottom:10px;">カラー</p><div class="color-grid" id="color-grid"></div><div class="modal-btns"><button class="btn btn-mint" style="flex:1" onclick="applyEditPJ()">保存</button><button class="btn" style="flex:1" onclick="closeModal()">キャンセル</button><button class="btn" style="color:#FF6B6B;border-color:#FF6B6B;" onclick="deletePJ('+i+')">削除</button></div>';openWith(h);buildCG(p.color);}
function buildCG(sel){var colors=["#74B9FF","#55EFC4","#FF7675","#FDCB6E","#A29BFE","#FD79A8","#00CEC9","#E17055","#6C5CE7","#00B894"];var g=document.getElementById("color-grid");if(!g)return;g.innerHTML="";colors.forEach(function(c){var d=document.createElement("div");d.className="color-dot"+(c===sel?" selected":"");d.style.background=c;d.onclick=function(){document.querySelectorAll(".color-dot").forEach(function(x){x.classList.remove("selected");});d.classList.add("selected");pickedColor=c;};g.appendChild(d);});if(!sel){pickedColor=colors[0];if(g.firstChild)g.firstChild.classList.add("selected");}}
function openWith(h){document.getElementById("modal-box").innerHTML=h;document.getElementById("overlay").classList.add("open");}
function closeModal(){document.getElementById("overlay").classList.remove("open");editingPJIdx=-1;}
function gv(id){var e=document.getElementById(id);return e?e.value:"";}
function lh(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);r=Math.round(r+(255-r)*0.82);g=Math.round(g+(255-g)*0.82);b=Math.round(b+(255-b)*0.82);return"#"+[r,g,b].map(function(x){return x.toString(16).padStart(2,"0");}).join("");}
function dk(h){var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);r=Math.round(r*0.5);g=Math.round(g*0.5);b=Math.round(b*0.5);return"#"+[r,g,b].map(function(x){return x.toString(16).padStart(2,"0");}).join("");}
function saveTask(){tasks.push({pj:gv("m-pj"),task:gv("m-task"),assign:gv("m-assign"),start:gv("m-start"),deadline:gv("m-end"),reason:gv("m-reason"),status:gv("m-status")});syncSave();closeModal();if(document.getElementById("tasks").classList.contains("active")){updatePJFilter();renderTasks();}if(document.getElementById("gantt").classList.contains("active"))renderGantt();}
function saveWait(){waitings.push({pj:gv("m-pj"),person:gv("m-person"),content:gv("m-content"),reqDate:gv("m-req"),dueDate:gv("m-due"),status:gv("m-wst")});syncSave();closeModal();if(document.getElementById("waiting").classList.contains("active"))renderWaiting();if(document.getElementById("gantt").classList.contains("active"))renderGantt();}
function saveMS(){milestones.push({pj:gv("m-pj"),name:gv("m-mname"),date:gv("m-mdate")});syncSave();closeModal();renderGantt();}
function saveStake(){stakeholders.push({pj:gv("m-pj"),name:gv("m-sname"),role:gv("m-srole"),contact:gv("m-scon"),priority:gv("m-spri"),memo:gv("m-memo")});syncSave();closeModal();if(document.getElementById("stake").classList.contains("active"))renderStake();}
function savePJ(){var name=gv("m-pjname").trim();if(!name)return;var emoji=gv("m-emoji").trim()||"🍩";PJS.push({name:name,color:pickedColor,light:lh(pickedColor),text:dk(pickedColor),emoji:emoji,hidden:""});syncSave();closeModal();renderGantt();updatePJFilter();}
function applyEditPJ(){var i=editingPJIdx;if(i<0)return;var newName=gv("ep-name").trim();if(!newName)return;var emoji=gv("ep-emoji").trim()||"🍩";var oldName=PJS[i].name;var wasHidden=PJS[i].hidden||"";PJS[i]={name:newName,color:pickedColor,light:lh(pickedColor),text:dk(pickedColor),emoji:emoji,hidden:wasHidden};[tasks,waitings,milestones,stakeholders].forEach(function(arr){arr.forEach(function(item){if(item.pj===oldName)item.pj=newName;});});syncSave();closeModal();renderGantt();updatePJFilter();}
function deletePJ(i){if(!confirm(PJS[i].name+"を削除しますか？"))return;PJS.splice(i,1);syncSave();closeModal();renderGantt();updatePJFilter();}

// PJ名ラベルの位置を現在のscrollLeftに合わせる
function updatePJLabels(){
  var scroller=document.getElementById("gantt-scroll");
  var inner=document.getElementById("gantt-inner");
  if(!scroller||!inner)return;
  var sl=scroller.scrollLeft;
  inner.querySelectorAll(".pj-label-overlay").forEach(function(el){
    el.style.left=sl+"px";
  });
}
// スクロールに応じてPJ名ラベルを画面左端に追従させる
function setupPJLabelSticky(){
  var scroller=document.getElementById("gantt-scroll");
  if(!scroller)return;
  scroller.addEventListener("scroll",updatePJLabels);
}

// ===== サーバーとの同期（外部ホスティング版：fetchでGAS Webアプリと通信） =====

// ↓↓ GAS WebアプリのURL（/exec で終わるもの）。再デプロイでURLが変わったらここだけ更新 ↓↓
var WEBAPP_URL="https://script.google.com/macros/s/AKfycbzvZXqA6Bk6wFhSal6n3lrN59wziz2jh3ZbP-ywtoW68yj1mB3kTHfz3gZleM83ZrJ6/exec";

var saveTimer=null;
function syncSave(){
  // 連続編集をまとめるためにデバウンス（1.2秒）
  if(saveTimer)clearTimeout(saveTimer);
  showSaveStatus("保存中...");
  saveTimer=setTimeout(function(){
    var payload=JSON.stringify({tasks:tasks,waitings:waitings,stakeholders:stakeholders,milestones:milestones,pjs:PJS});
    fetch(WEBAPP_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:payload
    })
    .then(function(r){return r.json();})
    .then(function(){showSaveStatus("✓ 保存しました");})
    .catch(function(e){showSaveStatus("⚠️ 保存失敗");});
  },1200);
}
function showSaveStatus(msg){
  var el=document.getElementById("save-status");
  if(el){el.textContent=msg;}
}
function loadFromServer(){
  showSaveStatus("読み込み中...");
  fetch(WEBAPP_URL)
    .then(function(r){return r.json();})
    .then(function(data){
      try{
        if(data.pjs&&data.pjs.length)PJS=data.pjs;
        if(data.tasks)tasks=data.tasks;
        if(data.waitings)waitings=data.waitings;
        if(data.stakeholders)stakeholders=data.stakeholders;
        if(data.milestones)milestones=data.milestones;
      }catch(e){}
      showSaveStatus("");
      renderGantt();
      scrollToToday();
    })
    .catch(function(e){showSaveStatus("⚠️ 読み込み失敗");renderGantt();scrollToToday();});
}
window.addEventListener("load",function(){setupPJLabelSticky();loadFromServer();});
</script>
